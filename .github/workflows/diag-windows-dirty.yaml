name: diag-windows-dirty

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup nb
        id: setup-nb
        uses: ./.github/actions/setup-nb
        with:
          version: '7.24.0'
      - name: Reproduce fixture init + dump git state
        shell: bash
        env:
          NB_API_TEST_NB: ${{ steps.setup-nb.outputs.nb-exec }}
        run: |
          set -x
          export NB_DIR="$HOME/.nb-diag"
          export HOME="$HOME/.nb-diag-home"
          mkdir -p "$NB_DIR" "$NB_DIR/.init_stub" "$HOME"
          printf '[user]\n\tname = probe\n\temail = probe@localhost\n' > "$HOME/.gitconfig"
          export GIT_AUTHOR_NAME=probe GIT_AUTHOR_EMAIL=probe@localhost
          export GIT_COMMITTER_NAME=probe GIT_COMMITTER_EMAIL=probe@localhost
          export GIT_CONFIG_COUNT=4
          export GIT_CONFIG_KEY_0=commit.gpgsign GIT_CONFIG_VALUE_0=false
          export GIT_CONFIG_KEY_1=tag.gpgsign GIT_CONFIG_VALUE_1=false
          export GIT_CONFIG_KEY_2=core.autocrlf GIT_CONFIG_VALUE_2=false
          export GIT_CONFIG_KEY_3=core.eol GIT_CONFIG_VALUE_3=lf
          "$NB_API_TEST_NB" notebooks add scratch
          echo "=== nb dir ==="
          find "$NB_DIR" -maxdepth 2 | head -30
          echo "=== git status ==="
          git -C "$NB_DIR/scratch" status --porcelain -uall --ignored=no
          echo "status-rc=$?"
          echo "=== git config -l ==="
          git -C "$NB_DIR/scratch" config -l
          echo "=== .index ==="
          ls -la "$NB_DIR/scratch/.index"
          echo "=== git log ==="
          git -C "$NB_DIR/scratch" log --oneline 2>&1 | head
