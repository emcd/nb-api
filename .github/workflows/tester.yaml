name: qa

on:
  pull_request:
    branches: ['*']
  push:
    branches: ['master', 'release-*']
  workflow_dispatch:
    inputs:
      base:
        description: 'Base SHA for the whitespace gate (optional; defaults to HEAD^ for non-initial state, or the empty-tree SHA for the initial push).'
        required: false
        type: string
        default: ''

env:
  CARGO_TERM_COLOR: always

jobs:

  initialize:
    uses: ./.github/workflows/core--initializer.yaml

  lint:
    needs: [initialize]
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Whitespace gate: dispatch on GitHub Actions event kind
      # via the sourced `scripts/lib/ci-dispatch.sh` library.
      # Per cycle-4b verdict C4B-V1-1, the dispatch must cover
      # the exact range of just-pushed commits (PR base SHA,
      # push before..sha, empty-tree SHA for initial commit),
      # never an empty range and never a single-commit subset
      # of a multi-commit push.
      - name: Whitespace Gate
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          DISPATCH_BASE: ${{ inputs.base }}
        run: |
          set -eu
          source scripts/lib/ci-dispatch.sh
          base="$(dispatch_base_sha)"
          echo "Whitespace gate: ${base}..HEAD (event=${GITHUB_EVENT_NAME})"
          scripts/check-whitespace.sh "${base}..HEAD"

      - name: Run Shell Integration Tests
        run: |
          set -eu
          bash scripts/tests/check-whitespace-test.sh
          bash scripts/tests/ci-dispatch-test.sh

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    needs: [initialize, lint]
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install nb
        # Shared cross-platform install (Git Bash .cmd launcher on
        # Windows, symlink on Unix), pinned to the version we develop
        # against. See .github/actions/setup-nb/action.yaml.
        id: setup-nb
        uses: ./.github/actions/setup-nb
        with:
          version: '7.24.0'

      - name: Build
        run: cargo build --release
        env:
          NB_API_TEST_NB: ${{ steps.setup-nb.outputs.nb-exec }}

      - name: Diagnostic (fixture dirty-state repro) — remove before merge
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          NB_API_TEST_NB: ${{ steps.setup-nb.outputs.nb-exec }}
        run: |
          set -x
          export NB_DIR="$HOME/.nb-diag"
          export HOME="$HOME/.nb-diag-home"
          mkdir -p "$NB_DIR" "$NB_DIR/.init_stub" "$HOME"
          printf '[user]\n\tname = probe\n\temail = probe@localhost\n' > "$HOME/.gitconfig"
          export GIT_AUTHOR_NAME=probe GIT_AUTHOR_EMAIL=probe@localhost
          export GIT_COMMITTER_NAME=probe GIT_COMMITTER_EMAIL=probe@localhost
          export GIT_CONFIG_COUNT=4
          export GIT_CONFIG_KEY_0=commit.gpgsign GIT_CONFIG_VALUE_0=false
          export GIT_CONFIG_KEY_1=tag.gpgsign GIT_CONFIG_VALUE_1=false
          export GIT_CONFIG_KEY_2=core.autocrlf GIT_CONFIG_VALUE_2=false
          export GIT_CONFIG_KEY_3=core.eol GIT_CONFIG_VALUE_3=lf
          # Mirror NbTestEnv::initialize_notebook exactly: NB_NOTEBOOK_PATH
          # points at the hidden stub so first-run _init is bypassed.
          NB_NOTEBOOK_PATH="$NB_DIR/.init_stub" "$NB_API_TEST_NB" notebooks add scratch
          printf 'scratch' > "$NB_DIR/.current"
          echo "=== nb dir ==="
          find "$NB_DIR" -maxdepth 2 | head -30
          echo "=== git status ==="
          git -C "$NB_DIR/scratch" status --porcelain -uall --ignored=no
          echo "status-rc=$?"
          echo "=== git config -l ==="
          git -C "$NB_DIR/scratch" config -l
          echo "=== .index hex ==="
          ls -la "$NB_DIR/scratch/.index"
          echo "=== git log ==="
          git -C "$NB_DIR/scratch" log --oneline 2>&1 | head

      - name: Test
        run: cargo test --release --all-features
        env:
          NB_API_TEST_NB: ${{ steps.setup-nb.outputs.nb-exec }}

  package:
    needs: [initialize, lint, test]
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify Package
        run: cargo package --no-verify --list --all-features

      - name: Dry-Run Publish
        run: cargo publish --dry-run --locked --all-features